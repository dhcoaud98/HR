<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3E7"/>
      <stop offset="1" stop-color="#F6E3CF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD58A"/>
      <stop offset="1" stop-color="#F7A94B"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A4B22" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 배경: 아침 -->
  <rect width="1200" height="640" fill="url(#sky)"/>
  <circle cx="1040" cy="120" r="70" fill="url(#sun)" opacity="0.9"/>
  <g stroke="#F7A94B" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="1040" y1="22" x2="1040" y2="4"/>
    <line x1="938" y1="120" x2="920" y2="120"/>
    <line x1="968" y1="48" x2="955" y2="35"/>
    <line x1="1112" y1="48" x2="1125" y2="35"/>
  </g>
  <path d="M0 520 C200 470 400 500 600 480 C800 460 1000 500 1200 470 L1200 640 L0 640 Z" fill="#EBCBA8"/>
  <path d="M0 560 C250 530 450 560 700 545 C900 532 1050 555 1200 540 L1200 640 L0 640 Z" fill="#E2B88F"/>

  <!-- 제목 -->
  <text x="60" y="78" font-size="38" font-weight="700" fill="#4A2E17">매일 아침 8:45, HR을 한 장으로</text>
  <text x="60" y="116" font-size="20" fill="#7A5A3C">사람을 키우는 일(HRD)에서 뽑고 · 평가하고 · 보상하고 · 지키는 일(HR)로</text>

  <!-- 왼쪽: 네 영역 소식 -->
  <g filter="url(#shadow)">
    <g transform="translate(60,170)">
      <rect width="250" height="66" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="33" r="20" fill="#E8F1FB"/>
      <path d="M24 42 L32 32 L38 37 L48 24" stroke="#3B7DD8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="30" font-size="18" font-weight="700" fill="#2B3A4A">HR 트렌드</text>
      <text x="68" y="52" font-size="14" fill="#6B7785">노동법 · 보상 · 조직문화</text>
    </g>
    <g transform="translate(60,252)">
      <rect width="250" height="66" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="33" r="20" fill="#EAF6EE"/>
      <rect x="25" y="27" width="22" height="16" rx="3" fill="none" stroke="#2E9B5B" stroke-width="3"/>
      <path d="M31 27 v-4 h10 v4" fill="none" stroke="#2E9B5B" stroke-width="3"/>
      <text x="68" y="30" font-size="18" font-weight="700" fill="#2B3A4A">채용 · 취업</text>
      <text x="68" y="52" font-size="14" fill="#6B7785">시장 동향 · AI 면접</text>
    </g>
    <g transform="translate(60,334)">
      <rect width="250" height="66" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="33" r="20" fill="#F3EDFB"/>
      <rect x="27" y="22" width="18" height="22" fill="none" stroke="#7B52C7" stroke-width="3"/>
      <path d="M32 29 h3 M38 29 h3 M32 35 h3 M38 35 h3" stroke="#7B52C7" stroke-width="2.5"/>
      <text x="68" y="30" font-size="18" font-weight="700" fill="#2B3A4A">HR 업계</text>
      <text x="68" y="52" font-size="14" fill="#6B7785">HR 테크 · 리서치 보고서</text>
    </g>
    <g transform="translate(60,416)">
      <rect width="250" height="66" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="33" r="20" fill="#FDF0E4"/>
      <circle cx="36" cy="33" r="7" fill="none" stroke="#D9772B" stroke-width="3"/>
      <path d="M36 20 v5 M36 41 v5 M23 33 h5 M44 33 h5" stroke="#D9772B" stroke-width="3" stroke-linecap="round"/>
      <text x="68" y="30" font-size="18" font-weight="700" fill="#2B3A4A">실무 툴</text>
      <text x="68" y="52" font-size="14" fill="#6B7785">HRIS · ATS · 생성형 AI</text>
    </g>
  </g>

  <!-- 흐름 화살표 -->
  <g stroke="#C98E5A" stroke-width="3" fill="none" stroke-dasharray="6 7" stroke-linecap="round">
    <path d="M318 203 C360 203 360 300 400 318"/>
    <path d="M318 285 C350 285 360 318 400 324"/>
    <path d="M318 367 C350 367 360 336 400 330"/>
    <path d="M318 449 C360 449 360 350 400 336"/>
  </g>

  <!-- 가운데: Claude 예약 작업 -->
  <g filter="url(#shadow)">
    <circle cx="470" cy="327" r="66" fill="#D97757"/>
  </g>
  <g transform="translate(470,327)" fill="#FFFFFF">
    <path d="M0 -34 L6 -6 L34 0 L6 6 L0 34 L-6 6 L-34 0 L-6 -6 Z"/>
  </g>
  <text x="470" y="424" font-size="17" font-weight="700" fill="#4A2E17" text-anchor="middle">Claude 예약 작업</text>
  <text x="470" y="446" font-size="14" fill="#7A5A3C" text-anchor="middle">검색 · 원문 확인 · 선별 · 요약</text>

  <path d="M545 327 L615 327" stroke="#C98E5A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M605 317 L617 327 L605 337" stroke="#C98E5A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 오른쪽: 브리핑 카드 -->
  <g filter="url(#shadow)">
    <rect x="635" y="170" width="300" height="320" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="635" y="170" width="300" height="56" rx="20" fill="#4A2E17"/>
  <rect x="635" y="206" width="300" height="20" fill="#4A2E17"/>
  <text x="660" y="206" font-size="19" font-weight="700" fill="#FFFFFF">📬 HR 브리핑</text>
  <text x="910" y="206" font-size="14" fill="#F6E3CF" text-anchor="end">오늘</text>
  <rect x="660" y="248" width="250" height="34" rx="8" fill="#FDF3E7"/>
  <text x="672" y="270" font-size="14" font-weight="700" fill="#8A5428">오늘의 한 줄</text>
  <g fill="#E3D6C8">
    <rect x="660" y="300" width="230" height="10" rx="5"/>
    <rect x="660" y="320" width="190" height="10" rx="5"/>
    <rect x="660" y="350" width="220" height="10" rx="5"/>
    <rect x="660" y="370" width="170" height="10" rx="5"/>
  </g>
  <rect x="660" y="402" width="250" height="62" rx="10" fill="#FFF7E8" stroke="#F2C48A" stroke-width="2"/>
  <text x="674" y="428" font-size="15" font-weight="700" fill="#B5651D">→ 나에게 의미</text>
  <rect x="674" y="440" width="200" height="9" rx="4.5" fill="#F2D7B3"/>

  <!-- 맨 오른쪽: 사람들 (성장하는 HR 담당자) -->
  <g transform="translate(1035,380)">
    <!-- 뒤쪽 동료 둘 -->
    <g fill="#B98A63" opacity="0.85">
      <circle cx="-62" cy="-22" r="20"/>
      <path d="M-94 50 C-94 10 -30 10 -30 50 Z"/>
      <circle cx="62" cy="-22" r="20"/>
      <path d="M30 50 C30 10 94 10 94 50 Z"/>
    </g>
    <!-- 가운데: 나 -->
    <circle cx="0" cy="-52" r="27" fill="#D97757"/>
    <path d="M-44 50 C-44 -8 44 -8 44 50 Z" fill="#D97757"/>
    <!-- 성장 새싹 -->
    <path d="M0 -92 C0 -110 0 -122 0 -132" stroke="#2E9B5B" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 -118 C-20 -126 -28 -142 -24 -150 C-8 -146 2 -134 0 -118 Z" fill="#45B36B"/>
    <path d="M0 -126 C18 -136 30 -134 34 -126 C26 -114 12 -114 0 -126 Z" fill="#2E9B5B"/>
  </g>
  <text x="1035" y="465" font-size="16" font-weight="700" fill="#4A2E17" text-anchor="middle">HRD → HR</text>
  <text x="1035" y="486" font-size="13" fill="#7A5A3C" text-anchor="middle">읽고 · 연결하고 · 성장하기</text>

  <!-- 하단 캡션 -->
  <text x="600" y="600" font-size="16" fill="#5C3B1F" text-anchor="middle">웹 검색 → 브리핑 작성 → GitHub 저장소에 매일 자동 업로드</text>
</svg>
